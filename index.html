<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eabf86" />
    <meta name="description" content="纸飞机 · 午后回声 — 一首歌，一个午后的三维纸飞机音乐飞行游戏" />
    <title>纸飞机 · 午后回声</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/hud.css" />
    <link rel="stylesheet" href="styles/tap.css" />
    <link rel="stylesheet" href="styles/covers.css" />
  </head>
  <body>
    <!-- 三维场景 -->
    <canvas id="scene" aria-label="午后公园中的纸飞机三维飞行场景"></canvas>
    <div id="shade"></div>
    <div id="flightTransition" aria-hidden="true"></div>

    <!-- HUD -->
    <div id="topbar">
      <div class="brand">
        <span class="brand-name">AFTERNOON ECHO</span>
        <div id="poem"><span id="poemMain"></span></div>
      </div>
      <div id="scoreBox" aria-label="游戏得分">
        <span>得分</span><strong id="scoreValue">0</strong>
      </div>
      <button id="musicToggle" aria-label="静音或恢复音乐">♫</button>
    </div>
    <div id="trackLine"><div id="trackFill"></div></div>

    <!-- 轻触区 -->
    <div id="tapArea">
      <button id="tapButton" aria-label="点击积蓄能量"><span class="tap-icon">✧</span></button>
      <div id="tapText">轻触，让风起</div>
      <div id="startTag">TAP TO BEGIN</div>
    </div>

    <div id="toast"></div>

    <!-- 封面 -->
    <div id="startCover">
      <div class="cover-kicker">一首歌 · 一个午后</div>
      <div class="cover-title">把心事<br />折成纸飞机</div>
      <div class="cover-desc">
        阳光落在公园小径上。<br />轻触唤起微风，让纸飞机追随音符，掠过树影与湖面。
      </div>
      <div class="cover-foot">音乐已内嵌 · 点击开始 · 建议佩戴耳机</div>
    </div>

    <div id="endCover" class="gone">
      <div class="cover-kicker">FLIGHT COMPLETE</div>
      <div class="cover-title">游戏结束<br />纸飞机飞向远方</div>
      <div class="cover-desc">音乐停在最后一拍，这个午后留在回声里。</div>
      <button id="restart">再飞一次</button>
    </div>

    <div id="err"></div>

    <!-- 第三方库（本地 vendor，不依赖 CDN） -->
    <script src="vendor/three.min.js"></script>

    <!-- 核心：常量 / 数学 / 状态 / 事件 -->
    <script src="js/core/constants.js"></script>
    <script src="js/core/math.js"></script>
    <script src="js/core/GameState.js"></script>
    <script src="js/core/EventBus.js"></script>

    <!-- 内嵌二进制资源（自动生成） -->
    <script src="js/assets/dreamScene.js"></script>

    <!-- 世界布景 -->
    <script src="js/world/scenery/sky.js"></script>
    <script src="js/world/scenery/ground.js"></script>
    <script src="js/world/scenery/parkPath.js"></script>
    <script src="js/world/scenery/pond.js"></script>
    <script src="js/world/scenery/gazebo.js"></script>
    <script src="js/world/scenery/benchesAndLamps.js"></script>
    <script src="js/world/scenery/trees.js"></script>
    <script src="js/world/scenery/sunAndClouds.js"></script>

    <!-- 实体 -->
    <script src="js/world/entities/PaperPlane.js"></script>
    <script src="js/world/entities/MusicNotes.js"></script>
    <script src="js/world/entities/MelodyGuide.js"></script>
    <script src="js/world/entities/Sparks.js"></script>
    <script src="js/world/entities/DreamScreen.js"></script>
    <script src="js/world/entities/TrailRibbon.js"></script>
    <script src="js/world/World.js"></script>

    <!-- 音频 -->
    <script src="js/audio/song-data.js"></script>
    <script src="js/audio/MelodyAnalyzer.js"></script>
    <script src="js/audio/AudioEngine.js"></script>

    <!-- 系统 -->
    <script src="js/systems/FlightController.js"></script>
    <script src="js/systems/ScoreSystem.js"></script>
    <script src="js/systems/CaptionSystem.js"></script>
    <script src="js/systems/InputController.js"></script>
    <script src="js/systems/MelodyRoute.js"></script>

    <!-- 阶段场景 -->
    <script src="js/phases/ReadyPhase.js"></script>
    <script src="js/phases/AwakeningPhase.js"></script>
    <script src="js/phases/TransformPhase.js"></script>
    <script src="js/phases/FlightPhase.js"></script>
    <script src="js/phases/FarewellPhase.js"></script>
    <script src="js/phases/EndedPhase.js"></script>

    <!-- UI -->
    <script src="js/ui/Hud.js"></script>
    <script src="js/ui/Toast.js"></script>
    <script src="js/ui/Covers.js"></script>
    <script src="js/ui/TapPad.js"></script>
    <script src="js/ui/FlightFlash.js"></script>

    <!-- 编排与入口 -->
    <script src="js/core/Game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
